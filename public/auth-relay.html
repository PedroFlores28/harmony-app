<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargando sesión...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f3e8ee;
      border-top: 4px solid #5c0f39;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #5c0f39; font-size: 1rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Iniciando sesión...</p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var session = params.get('session');

      if (!session) {
        window.location.replace('/login');
        return;
      }

      // Escribir sesión directamente en localStorage (mismo dominio = sin restricciones)
      try {
        localStorage.setItem('session', session);
        localStorage.setItem('affiliated', params.get('affiliated') || 'true');
        localStorage.setItem('name', params.get('name') || '');
        localStorage.setItem('lastName', params.get('lastName') || '');
        localStorage.setItem('dni', params.get('dni') || '');

        var path = params.get('path') || 'dashboard';
        // Limpiar la ruta
        path = path.replace(/^\//, '');
        if (!path) path = 'dashboard';

        // Redirigir a la app con la sesión ya guardada
        window.location.replace('/' + path);

      } catch (e) {
        // Si localStorage falla por alguna razón, intentar de todas formas
        var path = params.get('path') || 'dashboard';
        window.location.replace('/' + path.replace(/^\//, ''));
      }
    })();
  </script>
</body>
</html>
